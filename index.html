        <title>SuwonJ</title>
        <script>
            (() => {
                let theme = "dark";
                try { theme = localStorage.getItem("theme") || "dark"; } catch {}
                document.documentElement.classList.toggle("light-mode", theme === "light");
            })();
        </script>

            #halftone-canvas {
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                z-index: -1;
            }

            main {
                position: relative;
                pointer-events: none;
                /* global.css의 wide-screen margin-left 오버라이드 */
                margin-left: auto !important;
                margin-right: auto !important;
            }

            .landing-icons {
                display: flex;
                justify-content: center;
                gap: 2rem;
                margin-top: 2rem;
                pointer-events: auto;
            }

            .landing-icons a {
                display: flex;
                opacity: 0.55;
                transition: opacity 0.25s;
            }

            .landing-icons a:hover,
            .landing-icons a:focus-visible {
                opacity: 0.9;
            }

            .landing-icons svg {
                width: 20px;
                height: 20px;
                fill: var(--text-color);
            }

                <button id="theme-toggle" type="button" class="theme-toggle-btn" aria-label="라이트 모드로 전환">
                    <svg class="theme-icon-dark" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z" /></svg>
                    <svg class="theme-icon-light" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>
                </button>

        <canvas id="halftone-canvas"></canvas>
        <script>
            (() => {
                const canvas = document.getElementById("halftone-canvas");
                const ctx = canvas.getContext("2d");
                const w = document.documentElement.clientWidth, h = innerHeight;
                const dpr = devicePixelRatio || 1;
                canvas.width = w * dpr; canvas.height = h * dpr;
                canvas.style.width = w + "px"; canvas.style.height = h + "px";
                ctx.scale(dpr, dpr);
                const t = 0;
                const color = document.documentElement.classList.contains("light-mode") ? "0,0,0" : "255,255,255";
                for (let x = 17.5; x < w; x += 35) for (let y = 0; y < h; y += 35) {
                    const wave = Math.abs((Math.sin(x * .003 + t * .4) + Math.cos(y * .004 - t * .3) + Math.sin((x + y) * .002 + t * .5)) / 3);
                    ctx.beginPath(); ctx.arc(x, y, 1 + wave * 1.4, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(${color},${.08 + wave * .25})`; ctx.fill();
                }
                const button = document.getElementById("theme-toggle");
                button.setAttribute("aria-label", document.documentElement.classList.contains("light-mode") ? "다크 모드로 전환" : "라이트 모드로 전환");
            })();
        </script>

        <script type="module">
            import { renderNavbar } from "/components/navbar.js";
            import { HalftoneBackground } from "/components/halftone.js";

            renderNavbar();

            const bg = new HalftoneBackground("halftone-canvas", {
                iconSrc: "/assets/suwonjiconwhite.svg",
                iconScale: 0.38,
            });
            bg.init();

            // 아이콘 호버 → 해당 서비스 로고로 하프톤 배경 전환
            document.querySelectorAll(".landing-icons a").forEach((link) => {
                link.addEventListener("mouseenter", () => {
                    bg.setIcon(link.dataset.logo);
                });
                link.addEventListener("mouseleave", () => {
                    bg.setIcon("/assets/suwonjiconwhite.svg");
                });
            });
        </script>
