<!doctype html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>SuwonJ — 소개</title>
        <meta name="description" content="숭실대학교 AI소프트웨어학부 재학 중인 SuwonJ의 개인 소개 페이지." />
        <script>
            (() => {
                let theme = "dark";
                try { theme = localStorage.getItem("theme") || "dark"; } catch {}
                document.documentElement.classList.toggle("light-mode", theme === "light");
            })();
        </script>
        <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link rel="stylesheet" href="../css/global.css?v=20261023-7" />

        <style>
            #halftone-canvas {
                position: fixed;
                top: 0; left: 0;
                width: 100vw; height: 100vh;
                z-index: -1;
                pointer-events: none;
            }

            /* ── hr 투명화 (하프톤 도트만 표시) ── */
            hr {
                border: none;
                height: 1px;
                background: transparent;
                margin: 2.5rem 0;
            }

            /* ── 공통 섹션 ── */
            .profile-section {
                margin-bottom: 3.5rem;
            }

            .section-label {
                font-size: 0.82rem;
                color: var(--section-label-color);
                letter-spacing: 0.18em;
                text-transform: uppercase;
                margin-bottom: 1.5rem;
                font-family: monospace;
            }

            /* ── Hero ── */
            .profile-hero {
                padding: 3rem 0 1.5rem;
            }

            .profile-hero h1 {
                font-size: 3rem;
                color: var(--hero-title-color);
                margin: 0 0 0.6rem;
            }

            .profile-tagline {
                color: var(--tagline-color);
                font-size: 1rem;
                margin: 0;
                font-family: monospace;
            }

            /* ── About ── */
            .about-text {
                color: var(--about-text-color);
                line-height: 1.95;
                margin-bottom: 1rem;
            }

            .about-text:last-of-type {
                margin-bottom: 1.5rem;
            }

            .interest-tags {
                display: flex;
                flex-wrap: wrap;
                gap: 0.5rem;
            }

            .interest-tag {
                font-family: monospace;
                font-size: 0.85rem;
                color: var(--interest-text);
                padding: 0.2rem 0.7rem;
                border: 1px solid var(--interest-border);
                border-radius: 2px;
                transition: color 0.2s, border-color 0.2s;
                cursor: default;
            }

            .interest-tag:hover {
                color: var(--interest-text-hover);
                border-color: var(--interest-border-hover);
            }

            /* ── Skills (하프톤 도트 숙련도) ── */
            .skills-list {
                display: flex;
                flex-direction: column;
                gap: 1.2rem;
            }

            .skill-item {
                display: flex;
                align-items: center;
                gap: 1.2rem;
            }

            .skill-name {
                font-family: monospace;
                color: var(--skill-name-color);
                font-size: 0.95rem;
                min-width: 70px;
            }

            .skill-dots {
                display: flex;
                align-items: center;
                gap: 6px;
            }

            .skill-dot {
                border-radius: 50%;
                background: var(--skill-dot-color);
                transition: transform 0.2s;
            }

            .skill-dot.filled {
                opacity: 1;
            }

            .skill-dot.empty {
                opacity: 0.08;
            }

            /* ── Timeline ── */
            .timeline {
                display: flex;
                flex-direction: column;
                gap: 2rem;
                border-left: 1px solid var(--timeline-border);
                padding-left: 1.8rem;
                margin-left: 0.3rem;
            }

            .timeline-item {
                position: relative;
            }

            .timeline-item::before {
                content: '';
                position: absolute;
                left: -2.1rem;
                top: 0.45rem;
                width: 5px;
                height: 5px;
                border-radius: 50%;
                background: var(--timeline-dot-bg);
                border: 1px solid var(--timeline-dot-border);
            }

            .timeline-period {
                font-family: monospace;
                font-size: 0.82rem;
                color: var(--timeline-period-color);
                margin-bottom: 0.3rem;
            }

            .timeline-place {
                color: var(--timeline-place-color);
                font-size: 0.95rem;
                margin-bottom: 0.2rem;
            }

            .timeline-desc {
                color: var(--timeline-desc-color);
                font-size: 0.85rem;
                font-family: monospace;
            }

            /* ── Contact (세로 스택, 테두리 없음 — 하프톤 배경만) ── */
            .contact-list {
                display: flex;
                flex-direction: column;
                gap: 0;
            }

            .contact-card {
                display: flex;
                flex-direction: column;
                gap: 0.3rem;
                padding: 1.2rem 1.4rem;
                text-decoration: none;
                background: transparent;
                pointer-events: auto;
            }

            .contact-service {
                font-family: monospace;
                font-size: 0.8rem;
                color: var(--contact-service-color);
                text-transform: uppercase;
                letter-spacing: 0.12em;
                transition: color 0.25s;
            }

            .contact-handle {
                color: var(--contact-handle-color);
                font-size: 0.9rem;
                font-family: monospace;
                transition: color 0.25s;
            }

            .contact-card:hover .contact-service {
                color: var(--contact-service-hover);
            }

            .contact-card:hover .contact-handle {
                color: var(--contact-handle-hover);
            }

            /* ── 모바일 ── */
            @media (max-width: 768px) {
                .profile-hero h1 {
                    font-size: 2.2rem;
                }
            }
        </style>
        <script type="module" src="/components/navbar.js"></script>
    </head>
    <body class="reading-layout">
        <nav class="navbar">
            <a href="/" class="nav-logo"><img src="/assets/suwonjicon.svg" alt="SuwonJ" class="suwonj-nav-icon" width="35" height="30" /></a>
            <div id="nav-breadcrumb" class="nav-breadcrumb"></div>
            <div class="nav-links">
                <a href="/profile/">소개</a><a href="/blog/">블로그</a><a href="/research/">연구/실험</a>
                <button id="theme-toggle" type="button" class="theme-toggle-btn" aria-label="라이트 모드로 전환">
                    <svg class="theme-icon-dark" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z" /></svg>
                    <svg class="theme-icon-light" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>
                </button>
            </div>
        </nav>
        <canvas id="halftone-canvas"></canvas>
        <script>
            (() => {
                const canvas = document.getElementById("halftone-canvas");
                const ctx = canvas.getContext("2d");
                const w = document.documentElement.clientWidth, h = innerHeight;
                const dpr = devicePixelRatio || 1;
                canvas.width = w * dpr; canvas.height = h * dpr;
                canvas.style.width = w + "px"; canvas.style.height = h + "px";
                ctx.scale(dpr, dpr);
                const t = 0;
                const color = document.documentElement.classList.contains("light-mode") ? "0,0,0" : "255,255,255";
                for (let x = 17.5; x < w; x += 35) for (let y = 0; y < h; y += 35) {
                    const wave = Math.abs((Math.sin(x * .003 + t * .4) + Math.cos(y * .004 - t * .3) + Math.sin((x + y) * .002 + t * .5)) / 3);
                    ctx.beginPath(); ctx.arc(x, y, 1 + wave * 1.4, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(${color},${.08 + wave * .25})`; ctx.fill();
                }
                const button = document.getElementById("theme-toggle");
                button.setAttribute("aria-label", document.documentElement.classList.contains("light-mode") ? "다크 모드로 전환" : "라이트 모드로 전환");
            })();
        </script>

        <main
            style="
                position: relative;
                z-index: 1;
                padding: 3rem;
                max-width: 680px;
                margin: 0 auto;
            "
        >
            <div id="profile-root"></div>
        </main>

        <script type="module" src="./profile.js"></script>
    </body>
</html>
