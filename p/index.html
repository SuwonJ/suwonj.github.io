<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <meta name="googlebot" content="noindex,nofollow,noarchive" />
  <title>링크 페이지</title>
  <link rel="icon" href="/assets/suwonjiconwhite.svg" type="image/x-icon" />
  <link rel="stylesheet" href="/css/global.css" />
  <script>
    (function () {
      const savedTheme = localStorage.getItem('theme') || 'dark';
      if (savedTheme === 'light') document.documentElement.classList.add('light-mode');
    })();
  </script>
  <style>
    body { min-height: 100vh; }
    .link-page {
      width: min(760px, calc(100% - 2.5rem));
      margin: 0 auto;
      padding: 4.5rem 0 7rem;
    }
    .link-page-kicker {
      display: flex;
      align-items: center;
      gap: .55rem;
      margin-bottom: 1.3rem;
      font: 500 .78rem/1.4 monospace;
      color: var(--breadcrumb-color, #888);
    }
    .link-page-kicker::before {
      content: '';
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #34d399;
      box-shadow: 0 0 0 3px rgba(52, 211, 153, .12);
    }
    #page-title {
      margin: 0 0 .75rem;
      font-size: clamp(2rem, 5vw, 3.1rem);
      line-height: 1.15;
      letter-spacing: -.035em;
    }
    #page-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: .5rem .75rem;
      min-height: 2rem;
      margin-bottom: 2.8rem;
      color: var(--breadcrumb-color, #888);
      font: .8rem/1.5 monospace;
    }
    #page-meta .tag { color: inherit; }
    .copy-link {
      border: 1px solid var(--toc-border, #444);
      background: transparent;
      color: inherit;
      border-radius: 5px;
      padding: .27rem .55rem;
      font: inherit;
      cursor: pointer;
    }
    .copy-link:hover { color: var(--text-color, #fff); border-color: currentColor; }
    #content { font-size: 1.04rem; line-height: 1.82; }
    #content > :first-child { margin-top: 0; }
    #content h1, #content h2, #content h3 { scroll-margin-top: 2rem; }
    #content h2 { margin-top: 2.5rem; }
    #content h3 { margin-top: 2rem; }
    #content a { color: var(--nav-text); text-decoration: underline; text-underline-offset: .2em; }
    #content img, #content video { max-width: 100%; height: auto; border-radius: 7px; }
    #content .media-gallery { display: grid; gap: 1rem; margin: 1.5rem 0; }
    .table-wrapper { width: 100%; overflow-x: auto; }
    #content pre { position: relative; overflow-x: auto; }
    .code-copy-btn {
      position: absolute;
      top: .65rem;
      right: .7rem;
      border: 0;
      background: transparent;
      color: #8a8a8a;
      font: .7rem monospace;
      cursor: pointer;
    }
    .page-error {
      margin-top: 20vh;
      text-align: center;
      color: var(--breadcrumb-color, #888);
    }
    @media (max-width: 600px) {
      .link-page { width: min(100% - 2rem, 760px); padding-top: 2.75rem; }
      #content { font-size: 1rem; }
    }
  </style>
</head>
<body>
  <main class="link-page">
    <div class="link-page-kicker">LINK PAGE</div>
    <h1 id="page-title">불러오는 중...</h1>
    <div id="page-meta"></div>
    <article id="content">문서를 불러오는 중입니다.</article>
  </main>
  <script type="module" src="./p.js"></script>
</body>
</html>
